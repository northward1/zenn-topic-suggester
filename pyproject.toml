[project]
name = "zenn-topic-suggester"
version = "0.1.0"
description = "Zennの記事に設定する最適なトピックを自動で検索するCLIツール"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "northward", email= "196759132+northward1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pandas>=3.0.6",
    "transformers>=5.17.0",
]
keywords = ["zenn", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Natural Language :: Japanese",
]

[project.urls]
Homepage = "https://github.com/northward1/zenn-topic-suggester"
Repository = "https://github.com/northward1/zenn-topic-suggester"
Issues = "https://github.com/northward1/zenn-topic-suggester/issues"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
zenn-topic-suggest = "zenn_topic_suggester:main"
